<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>BareMedix - interactive prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Public+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#f1f5f9;--paper2:#e5ebf2;--panel:#ffffff;--field:#ffffff;--ink:#1e293b;--muted:#566479;--line:#dbe3ec;
  --primary:#0284c7;--primary-d:#0369a1;--primary-text:#0369a1;--primary-soft:#e0f2fe;--on-primary:#ffffff;
  --mint:#0f9d74;--mint-soft:#dcf5ec;--mint-ink:#0b6b4f;
  --alarm:#d93f3f;--alarm-d:#b02f2f;--alarm-soft:#fdeaea;--alarm-ink:#9f2b2b;
  --amber-ink:#8a5a0b;--amber-soft:#fcf0d8;
  --hero1:#075985;--hero2:#0284c7;--hero3:#38bdf8;--bar:#1e293b;--chat-bg:#f5f8fb;--focus:#0284c7;
  --shadow:0 1px 2px rgba(30,41,59,.06),0 10px 26px -14px rgba(30,41,59,.22);
  --font-display:'Bricolage Grotesque','Segoe UI',system-ui,sans-serif;
  --font-body:'Public Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#0f172a;--paper2:#18233a;--panel:#162033;--field:#0f1a2e;--ink:#e2e8f0;--muted:#94a3b8;--line:#25324b;
    --primary-text:#7dd3fc;--primary-soft:#0c2c43;--mint:#34d399;--mint-soft:#10392d;--mint-ink:#7ee8c3;
    --alarm:#d94a4a;--alarm-d:#b73a3a;--alarm-soft:#3a1717;--alarm-ink:#ffa9a9;
    --amber-ink:#f0b45c;--amber-soft:#3a2b10;--chat-bg:#0f1a2e;--focus:#38bdf8;--shadow:0 1px 2px rgba(0,0,0,.3),0 10px 26px -14px rgba(0,0,0,.6);
  }
}
:root[data-theme="dark"]{
  --paper:#0f172a;--paper2:#18233a;--panel:#162033;--field:#0f1a2e;--ink:#e2e8f0;--muted:#94a3b8;--line:#25324b;
  --primary-text:#7dd3fc;--primary-soft:#0c2c43;--mint:#34d399;--mint-soft:#10392d;--mint-ink:#7ee8c3;
  --alarm:#d94a4a;--alarm-d:#b73a3a;--alarm-soft:#3a1717;--alarm-ink:#ffa9a9;
  --amber-ink:#f0b45c;--amber-soft:#3a2b10;--chat-bg:#0f1a2e;--focus:#38bdf8;--shadow:0 1px 2px rgba(0,0,0,.3),0 10px 26px -14px rgba(0,0,0,.6);
}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%;scroll-behavior:smooth}
*{box-sizing:border-box}
body{margin:0;color:var(--ink);font:16px/1.55 var(--font-body);background:var(--paper);
  background-image:radial-gradient(1200px 500px at 85% -10%,var(--paper2),transparent 70%)}
h1,h2,h3{font-family:var(--font-display);line-height:1.15;margin:0 0 .4rem;letter-spacing:-.012em}
h1{font-size:clamp(2rem,5vw,3.1rem);font-weight:700}h2{font-size:1.32rem}h3{font-size:1.06rem}
p{margin:0 0 .7rem}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.muted{color:var(--muted)}.small{font-size:.875rem}
.ic{flex:none;vertical-align:-.2em}.rot135{transform:rotate(135deg)}

/* ---- shell ---- */
.shell{min-height:100vh;display:flex;flex-direction:column}
.topbar{position:sticky;top:0;z-index:20;display:flex;justify-content:space-between;align-items:center;gap:.75rem;padding:.65rem clamp(1rem,4vw,2.5rem);background:var(--bar);color:#fff;border-bottom:1px solid rgba(255,255,255,.08);backdrop-filter:blur(6px);flex-wrap:wrap}
.topbar .right{display:flex;align-items:center;gap:.6rem;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:.55rem;font:700 1.25rem var(--font-display);letter-spacing:-.01em}
.mark{display:grid;place-items:center;width:2rem;height:2rem;background:linear-gradient(145deg,#38bdf8,#0284c7);border-radius:10px;box-shadow:0 4px 12px -4px rgba(2,132,199,.7)}
.brand small{display:block;font:500 .68rem var(--font-body);color:#94a3b8;letter-spacing:0;margin-top:-.15rem}
.roles{display:inline-flex;background:rgba(255,255,255,.09);border-radius:99px;padding:3px}
.roles button{background:none;border:0;padding:.38rem .85rem;border-radius:99px;cursor:pointer;font-weight:600;color:#cbd5e1;display:flex;gap:.35rem;align-items:center}
.roles button:hover{color:#fff}
.roles button.on{background:var(--primary);color:var(--on-primary)}
.main{flex:1;width:100%;max-width:1080px;margin:0 auto;padding:1.1rem clamp(1rem,4vw,2rem) 3rem}
.foot .hfr{margin-top:.35rem;font-weight:600;color:var(--primary-text)}
.mono{font-family:ui-monospace,Menlo,Consolas,monospace;letter-spacing:.04em}
.foot{text-align:center;font-size:.8rem;color:var(--muted);padding:1.1rem 1rem;border-top:1px solid var(--line)}
.stack{display:grid;gap:1rem;align-content:start}
.split{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:1rem;align-items:start}
@media(max-width:860px){.split{grid-template-columns:1fr}}

/* ---- surfaces ---- */
.panel{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:1.1rem 1.25rem;box-shadow:var(--shadow)}
.panel.accent{background:var(--mint-soft);border-color:transparent}
.panel.center{text-align:center;padding:2.6rem 1.2rem}
.panel-head{display:flex;justify-content:space-between;align-items:center;gap:.75rem;margin-bottom:.5rem}
.sticky{position:sticky;top:4.5rem}
.notice{background:var(--mint-soft);color:var(--mint-ink);border-radius:10px;padding:.65rem .9rem;font-weight:500}
.error{color:var(--alarm-ink);background:var(--alarm-soft);border-radius:10px;padding:.5rem .8rem;font-weight:500}
.guide{display:flex;gap:.7rem;align-items:center;background:var(--primary-soft);border-radius:12px;padding:.6rem .95rem;margin-bottom:1rem;color:var(--ink)}
.guide .tag{flex:none;background:var(--primary);color:var(--on-primary);border-radius:99px;padding:.1rem .65rem;font-size:.78rem;font-weight:700}
.btn{border:1px solid transparent;border-radius:10px;padding:.55rem 1rem;cursor:pointer;font-weight:600;background:none;transition:background .15s,border-color .15s,transform .05s;display:inline-flex;align-items:center;justify-content:center;gap:.45rem}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--primary);color:var(--on-primary)}.btn.primary:hover{background:var(--primary-d)}
.btn.alarm{background:var(--alarm);color:#fff;text-decoration:none}.btn.alarm:hover{background:var(--alarm-d)}
.btn.ghost{border-color:var(--line);background:var(--panel)}.btn.ghost:hover{border-color:var(--primary)}
.btn.light{background:#fff;color:#075985}.btn.light:hover{background:#e0f2fe}
.btn.small{padding:.28rem .65rem;font-size:.85rem;border-radius:8px}.btn.wide{width:100%;margin-top:.4rem}
.btn:disabled{opacity:.55;cursor:not-allowed}
.link{background:none;border:0;color:var(--primary-text);text-decoration:underline;cursor:pointer;padding:0}
label{display:grid;gap:.3rem;margin-bottom:.85rem;font-weight:500;font-size:.95rem}
input,select,textarea{border:1px solid var(--line);border-radius:10px;padding:.6rem .75rem;background:var(--field);width:100%}
input:focus,select:focus,textarea:focus{border-color:var(--primary)}
.seg{display:inline-flex;background:var(--paper2);border-radius:99px;padding:3px;margin-bottom:1rem;flex-wrap:wrap}
.seg button{border:0;background:none;padding:.45rem .95rem;border-radius:99px;cursor:pointer;font-weight:600;color:var(--muted)}
.seg button.on{background:var(--panel);color:var(--primary-text);box-shadow:var(--shadow)}
.tabs{display:flex;gap:.3rem;margin-bottom:1.1rem;overflow-x:auto;padding-bottom:2px}
.tabs button{border:1px solid transparent;background:none;padding:.55rem .95rem;cursor:pointer;font-weight:600;color:var(--muted);border-radius:99px;white-space:nowrap;display:flex;gap:.45rem;align-items:center}
.tabs button:hover{background:var(--paper2)}
.tabs button.on{background:var(--primary);color:var(--on-primary)}
.bottomnav{display:none}
.pill{display:inline-flex;gap:.3rem;align-items:center;background:var(--primary-soft);color:var(--primary-text);border-radius:99px;padding:.15rem .7rem;font-size:.82rem;font-weight:600}
.pill.off{background:var(--paper2);color:var(--muted)}.pill.good{background:var(--mint-soft);color:var(--mint-ink)}
.dot{width:.55rem;height:.55rem;border-radius:50%;background:var(--mint);display:inline-block}
.chips{display:flex;gap:.4rem;flex-wrap:wrap;margin:.1rem 0 .8rem}
.chip{border:1px solid var(--line);background:var(--panel);border-radius:99px;padding:.25rem .75rem;cursor:pointer;font-size:.88rem;font-weight:500}.chip:hover{border-color:var(--primary);color:var(--primary-text)}
.ico{display:grid;place-items:center;width:2.6rem;height:2.6rem;border-radius:12px;background:var(--primary-soft);color:var(--primary-text);flex:none}
.ico.mint{background:var(--mint-soft);color:var(--mint-ink)}.ico.amber{background:var(--amber-soft);color:var(--amber-ink)}.ico.rose{background:var(--alarm-soft);color:var(--alarm-ink)}
.avatar{display:grid;place-items:center;width:2.8rem;height:2.8rem;border-radius:50%;background:linear-gradient(145deg,#38bdf8,#0284c7);color:#fff;font-weight:700;flex:none}

/* ---- hero ---- */
.hero{position:relative;overflow:hidden;border-radius:24px;padding:clamp(1.4rem,4vw,2.6rem);margin-bottom:1rem;color:#fff;background:linear-gradient(125deg,#075985,#0284c7 62%,#38bdf8);
  display:grid;grid-template-columns:1.2fr 1fr;gap:1.6rem;align-items:center}
@media(max-width:860px){.hero{grid-template-columns:1fr}}
.hero::before{content:'';position:absolute;inset:0;background-image:radial-gradient(rgba(255,255,255,.14) 1.2px,transparent 1.4px);background-size:22px 22px;opacity:.5;pointer-events:none}
.hero>*{position:relative}
.gbadges{display:flex;gap:.45rem;flex-wrap:wrap;margin-bottom:.9rem}
.gbadge{display:inline-flex;gap:.35rem;align-items:center;background:rgba(7,63,100,.38);border:1px solid rgba(255,255,255,.3);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);color:#fff;border-radius:99px;padding:.22rem .8rem;font-size:.8rem;font-weight:600;box-shadow:inset 0 1px 0 rgba(255,255,255,.18)}
.hero .lede{font-size:1.06rem;color:#e0f2fe;max-width:32rem}
.hero .cta{display:flex;gap:.6rem;flex-wrap:wrap;margin-top:1rem}
.hero .btn.ghost{background:transparent;color:#fff;border-color:#ffffff66}.hero .btn.ghost:hover{border-color:#fff}
.ecg{position:absolute;left:0;right:0;bottom:.4rem;width:100%;height:70px;opacity:.9;pointer-events:none}
.ecg path{fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.ecg .base{stroke:#ffffff44}.ecg .beat{stroke:#bae6fd;stroke-dasharray:150 1000;animation:ecg 3.6s linear infinite;filter:drop-shadow(0 0 5px #7dd3fc)}
@keyframes ecg{from{stroke-dashoffset:150}to{stroke-dashoffset:-1000}}
@media (prefers-reduced-motion:reduce){.ecg .beat{animation:none;stroke-dasharray:none}}
.receipt{background:#ffffff;color:#1e293b;border-radius:6px;padding:1rem 1.15rem 1.1rem;width:min(100%,25rem);justify-self:end;font-variant-numeric:tabular-nums;box-shadow:0 18px 40px -18px rgba(0,0,0,.55);transform:rotate(1.2deg)}
@media(max-width:860px){.receipt{justify-self:start}}
.receipt-row{display:flex;justify-content:space-between;gap:1rem;padding:.2rem 0}
.receipt-row.head{font-weight:600;border-bottom:1px dashed #9fb4be;margin-bottom:.35rem;padding-bottom:.45rem}
.receipt-row s{color:#6b8591}.receipt-row b{color:#0369a1}
.receipt-row.total{border-top:1px dashed #9fb4be;margin-top:.45rem;padding-top:.45rem;font-weight:700;font-size:1.1rem}
.receipt .fine{margin:.4rem 0 .5rem;font-size:.75rem;color:#6b8591}
.bar{height:8px;background:var(--paper2);border-radius:99px;overflow:hidden;margin-top:.4rem}.bar i{display:block;height:100%;background:linear-gradient(90deg,#0284c7,#38bdf8);border-radius:99px}
.receipt .bar{background:#e4eef1}
.trust{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:.6rem;margin-bottom:1.1rem}
@media(max-width:860px){.trust{grid-template-columns:repeat(2,minmax(0,1fr))}}
.trust div{display:flex;gap:.55rem;align-items:center;font-size:.86rem;font-weight:500;color:var(--muted);line-height:1.3}
.trust .ic{color:var(--primary-text)}

/* ---- lists ---- */
.list{list-style:none;margin:0;padding:0;display:grid;gap:.65rem}
.row{display:grid;grid-template-columns:auto minmax(0,1fr) auto auto;gap:.9rem;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:.8rem 1rem;box-shadow:var(--shadow)}
.row.r3{grid-template-columns:auto minmax(0,1fr) auto}
@media(max-width:620px){.row{grid-template-columns:auto minmax(0,1fr) auto}.row .price{grid-column:2;grid-row:2;text-align:left;justify-items:start}.row .qty{grid-column:3;grid-row:1/3}}
.row .main2{display:grid;gap:.1rem;min-width:0}
.price{display:grid;text-align:right;justify-items:end;font-variant-numeric:tabular-nums}
.price s{color:var(--muted);font-size:.85rem}.price b{font-size:1.25rem;font-family:var(--font-display)}
.save{background:var(--mint-soft);color:var(--mint-ink);font-size:.76rem;font-weight:700;border-radius:99px;padding:.02rem .5rem}
.rxtag{margin-left:.5rem;font-size:.74rem;background:var(--amber-soft);color:var(--amber-ink);padding:.05rem .45rem;border-radius:99px;font-weight:600}
.qty{display:flex;align-items:center;gap:.5rem}
.qty .sq{width:2rem;height:2rem;border-radius:8px;border:1px solid var(--line);background:var(--panel);cursor:pointer;font-size:1.1rem}
.plain{list-style:none;margin:0;padding:0;display:grid;gap:.45rem}.plain li{display:flex;justify-content:space-between;gap:1rem;align-items:center}
.line{display:flex;justify-content:space-between;gap:1rem;padding:.2rem 0}
.line.total{border-top:1px solid var(--line);margin-top:.3rem;padding-top:.55rem;font-size:1.1rem}
.save-banner{background:var(--mint-soft);color:var(--mint-ink);font-weight:700;padding:.55rem .8rem;border-radius:10px;margin:.5rem 0 .9rem}
.order{border-top:1px solid var(--line);padding:.75rem 0}.order:first-of-type{border-top:0}
.progress{list-style:none;display:flex;padding:0;margin:.5rem 0 .6rem}
.progress li{flex:1;position:relative;font-size:.72rem;color:var(--muted);text-align:center;padding-top:22px}
.progress li::before{content:'';position:absolute;top:5px;left:50%;width:13px;height:13px;border-radius:50%;background:var(--line);transform:translateX(-50%);z-index:1}
.progress li::after{content:'';position:absolute;top:11px;left:-50%;width:100%;height:3px;background:var(--line)}
.progress li:first-child::after{display:none}
.progress li.done::before,.progress li.done::after{background:var(--mint)}
.progress li.done{color:var(--mint-ink);font-weight:600}

/* ---- consult + video ---- */
.steps{list-style:none;margin:.2rem 0 0;padding:0;display:grid;gap:.9rem}
.steps li{display:flex;gap:.75rem;align-items:flex-start}.steps b{display:block}
.pulse{position:relative;width:5.5rem;height:5.5rem;margin:0 auto 1rem;display:grid;place-items:center}
.pulse::before,.pulse::after{content:'';position:absolute;inset:0;border-radius:50%;border:2px solid var(--primary);opacity:0;animation:ring 2.2s ease-out infinite}
.pulse::after{animation-delay:1.1s}
@keyframes ring{from{transform:scale(.55);opacity:.7}to{transform:scale(1.25);opacity:0}}
@media (prefers-reduced-motion:reduce){.pulse::before,.pulse::after{animation:none;opacity:.3}}
.timer{font:700 2.8rem var(--font-display);font-variant-numeric:tabular-nums;margin:.2rem 0 .6rem}
.call-wrap{display:grid;grid-template-columns:minmax(0,1.7fr) minmax(0,1fr);gap:1rem;align-items:start}
@media(max-width:860px){.call-wrap{grid-template-columns:1fr}}
.call-head{display:flex;gap:.75rem;align-items:center;margin-bottom:.8rem}.call-head>div{flex:1;display:grid;min-width:0}
.stage{position:relative;aspect-ratio:16/10;background:#1e293b;border-radius:18px;overflow:hidden;color:#fff;isolation:isolate}
.v-remote{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block;background:#0b2a38}
.stage.speaking{outline:3px solid #6ff0d6;outline-offset:-3px}
.stage-top{position:absolute;left:0;right:0;top:0;display:none;gap:.5rem;align-items:center;padding:.7rem .8rem;background:linear-gradient(rgba(4,18,26,.7),transparent);flex-wrap:wrap}
.stage[data-state="live"] .stage-top{display:flex}
.stage-top b{margin-right:auto;font-weight:600}
.schip{background:#ffffff26;backdrop-filter:blur(6px);border-radius:99px;padding:.1rem .6rem;font-size:.78rem;font-weight:600;display:inline-flex;gap:.3rem;align-items:center}
.live-dot{width:.6rem;height:.6rem;border-radius:50%;background:#ff5a5a;animation:blink 1.4s infinite}
@keyframes blink{50%{opacity:.35}}
.pip{position:absolute;right:.8rem;bottom:4.9rem;width:27%;max-width:190px;aspect-ratio:4/3;border-radius:12px;overflow:hidden;border:2px solid #ffffffcc;background:#173646;display:none;transition:box-shadow .1s}
.stage[data-state="live"] .pip{display:block}
.pip video{width:100%;height:100%;object-fit:cover;transform:scaleX(-1);display:block}
.pip-off{position:absolute;inset:0;display:none;place-items:center;background:#173646;font:700 1.6rem var(--font-display)}
.pip.off .pip-off{display:grid}
.pip-label{position:absolute;left:.4rem;bottom:.3rem;font-size:.72rem;background:#0008;border-radius:6px;padding:0 .35rem}
.stage-bar{position:absolute;left:0;right:0;bottom:0;display:none;justify-content:center;gap:.8rem;padding:.8rem;background:linear-gradient(transparent,rgba(4,18,26,.8))}
.stage[data-state="live"] .stage-bar{display:flex}
.cbtn{width:3rem;height:3rem;border-radius:50%;border:0;background:#ffffff2e;color:#fff;cursor:pointer;display:grid;place-items:center;backdrop-filter:blur(6px);transition:background .15s}
.cbtn:hover{background:#ffffff48}.cbtn.off{background:#fff;color:#0b2a38}.cbtn.end{background:var(--alarm)}.cbtn.end:hover{background:var(--alarm-d)}
.stage-note{position:absolute;left:.8rem;right:.8rem;top:3rem;background:#0b2a38d9;border-radius:10px;padding:.4rem .7rem;font-size:.82rem;display:none}
.stage-note.show{display:block}
.cover{position:absolute;inset:0;z-index:2;display:grid;place-items:center;text-align:center;padding:1.2rem;background:linear-gradient(140deg,#075985,#0284c7 70%,#38bdf8)}
.stage[data-state="live"] .cover{display:none}
.cover-in{max-width:24rem;display:grid;gap:.6rem;justify-items:center}
.cover-in h3{margin:0}.cover-in p{margin:0;color:#e0f2fe;font-size:.92rem}.cover-in small{color:#bae6fd}
.cover-ico{width:3.6rem;height:3.6rem;border-radius:50%;background:#ffffff26;display:grid;place-items:center}
.spin{width:2.2rem;height:2.2rem;border:3px solid #ffffff44;border-top-color:#fff;border-radius:50%;animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.chat-log{background:var(--chat-bg);border-radius:12px;padding:.75rem;height:260px;overflow-y:auto;display:flex;flex-direction:column;gap:.4rem}
.call-chat .chat-log{height:330px}.chat-log.tall{height:330px;margin:.6rem 0}
.bubble{max-width:84%;padding:.5rem .8rem;border-radius:14px;overflow-wrap:anywhere}
.bubble.me{align-self:flex-end;background:var(--primary);color:var(--on-primary);border-bottom-right-radius:4px}
.bubble.them{align-self:flex-start;background:var(--panel);border:1px solid var(--line);border-bottom-left-radius:4px}
.bubble.wide{max-width:100%;width:100%}
.chat-form{display:flex;gap:.5rem;margin-top:.55rem}
.quick{display:flex;gap:.4rem;flex-wrap:wrap;margin:.4rem 0}
.status{display:flex;justify-content:space-between;align-items:center;gap:1rem;flex-wrap:wrap}
.status>div:first-child{display:flex;gap:.9rem;align-items:center}
.switch{border:2px solid var(--line);background:var(--panel);border-radius:99px;padding:.55rem 1.4rem;font-weight:700;cursor:pointer}.switch.on{background:var(--mint);border-color:var(--mint);color:var(--on-primary)}
.rx-row{display:grid;grid-template-columns:1fr 1fr 6rem auto;gap:.5rem;align-items:center;margin-bottom:.6rem}
@media(max-width:700px){.rx-row{grid-template-columns:1fr}}
.kv{margin:0;display:grid;gap:.45rem}.kv>div{display:grid;grid-template-columns:8rem 1fr;gap:.6rem}.kv dt{color:var(--muted);font-size:.9rem}.kv dd{margin:0}
.cipher{font:12px/1.4 ui-monospace,Menlo,Consolas,monospace;background:var(--chat-bg);border-radius:8px;padding:.4rem .55rem;word-break:break-all;color:var(--muted);margin-top:.35rem}
.day{border-top:1px solid var(--line);padding:.7rem 0}.safety{color:var(--amber-ink);padding-left:1.1rem;margin:.5rem 0 1rem}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:.7rem}

.sheet{background:var(--panel);border-radius:20px;width:min(100%,38rem);padding:1.2rem 1.3rem 1.5rem;margin-top:4vh;border-top:6px solid var(--alarm)}

.protocol ol{padding-left:1.3rem;display:grid;gap:.6rem;font-size:1.05rem;margin:.9rem 0 0}

}

/* ---------- real AES-256-GCM envelope encryption in the browser ---------- */
const hasCrypto = !!(window.crypto && crypto.subtle);
let KEK;
const hex = (b) => [...new Uint8Array(b)].map((x) => x.toString(16).padStart(2, '0')).join('');
async function getKEK() { return KEK || (KEK = await crypto.subtle.generateKey({ name: 'AES-GCM', length: 256 }, false, ['encrypt', 'decrypt'])); }
async function encRec(obj, aad) {
  if (!hasCrypto) return { plain: obj, preview: '(WebCrypto unavailable here: demo record stored unencrypted)' };
  const te = new TextEncoder();
  const dek = await crypto.subtle.generateKey({ name: 'AES-GCM', length: 256 }, true, ['encrypt', 'decrypt']);
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const ct = await crypto.subtle.encrypt({ name: 'AES-GCM', iv, additionalData: te.encode(aad) }, dek, te.encode(JSON.stringify(obj)));
  const raw = await crypto.subtle.exportKey('raw', dek);
  const iv2 = crypto.getRandomValues(new Uint8Array(12));
  const wrapped = await crypto.subtle.encrypt({ name: 'AES-GCM', iv: iv2 }, await getKEK(), raw);
  return { ct, iv, wrapped, iv2, aad, preview: hex(ct).slice(0, 96) + '...' };
}
async function decRec(r) {
  if (r.plain) return r.plain;
  const raw = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: r.iv2 }, await getKEK(), r.wrapped);
  const dek = await crypto.subtle.importKey('raw', raw, 'AES-GCM', false, ['decrypt']);
  const pt = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: r.iv, additionalData: new TextEncoder().encode(r.aad) }, dek, r.ct);
  return JSON.parse(new TextDecoder().decode(pt));
}

/* ---------- video call ----------

   RTCPeerConnection pair that carries the other participant's video and reports live stats.
   Simulated part: the other participant (an animated avatar drawn on a canvas), because a demo
   page has no second person. In production, signalling goes over the existing Socket.IO connection. */
function drawAvatar(ctx, W, H, t, kind, speaking) {
  const doc = kind === 'doctor';
  const g = ctx.createLinearGradient(0, 0, W, H); g.addColorStop(0, doc ? '#0c5566' : '#26466f'); g.addColorStop(1, doc ? '#1fb0a6' : '#6a9bd8');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = 'rgba(255,255,255,.07)';
  [[90, 80, 70], [560, 60, 46], [530, 330, 90], [70, 320, 52]].forEach(([x, y, r]) => { ctx.beginPath(); ctx.arc(x, y, r, 0, 7); ctx.fill(); });
  const cx = W / 2, bob = Math.sin(t * 1.6) * 2.5, sway = Math.sin(t * 0.8) * 3;

function kv(v) {
  if (Array.isArray(v)) return `<ul class="plain">${v.map((x) => `<li>${kv(x)}</li>`).join('')}</ul>`;
  if (v && typeof v === 'object') return `<dl class="kv">${Object.entries(v).map(([k, x]) => `<div><dt>${esc(k.replace(/_/g, ' '))}</dt><dd>${kv(x)}</dd></div>`).join('')}</dl>`;
  return esc(v);
}

  return `<div class="stack"><section class="panel status"><div><span class="ico">${ic('shield', 22)}</span><div><h2 style="margin:0">Health Facility Registry (HFR)</h2><p class="muted small" style="margin:0">This platform is registered as a health facility on the ABDM network (demo data).</p></div></div><span class="pill good">${ic('check', 14)} HFR Facility ID: IN-RJ-00014X</span></section>
  <section class="panel"><h2>Pilot loop metrics</h2><div class="kpis">
  ${k('users', '', S.online ? 1 : 0, 'doctors online')}${k('clock', 'mint', dts.length ? mmss(median(dts)) : 'No data yet', 'median time to a doctor')}${k('signal', '', dts.length ? Math.round((100 * dts.filter((x) => x <= 120).length) / dts.length) + '%' : 'No data yet', 'matched within 2 min SLA')}
  ${k('video', 'amber', dur.length ? mmss(median(dur)) : 'No data yet', 'median consult length (target 05:00)')}${k('check', 'mint', S.done.length, 'consults completed')}${k('truck', 'rose', del.length ? Math.round(median(del.map((o) => (o.tDel - o.t) / 60000)) * 10) / 10 + ' min' : 'No data yet', 'median delivery time')}${k('pill', 'mint', money(saved), 'patient savings vs brands')}</div>
  <p class="muted small" style="margin-top:.8rem">These numbers come from what you do in this demo. Run a consult and deliver an order, then come back.</p></section>
  <section class="panel"><h3>Doctors awaiting verification</h3><p class="muted small">Check each registration number against the HPR, NMC and State Medical Council registers before approving.</p>
  ${S.pendingDoc ? `<ul class="list"><li class="row r3"><span class="avatar">IJ</span><div class="main2"><b>Dr. Ishita Jain</b><span class="muted small">General Medicine. Registration DEMO-RJ-33333.</span></div><div class="qty"><button class="btn primary" data-act="approve">Approve</button></div></li></ul>` : '<p class="muted">No one is waiting.</p>'}</section></div>`;
}

function vSOS() {
  if (!S.sos) return '';
  const p = S.sos !== 'list' && PROTOCOLS.find((x) => x.id === S.sos);
  return `<div class="overlay" role="dialog" aria-modal="true" aria-label="Emergency help"><div class="sheet"><div class="sheet-head"><h2>${p ? 'Do this now' : 'What is happening?'}</h2>
  <button class="btn ghost" data-act="${p ? 'sosBack' : 'sosClose'}">${p ? 'Back' : 'Close'}</button></div>
  ${p ? protocolHtml(p) : `<a class="btn alarm wide" href="tel:112">${ic('phone', 18)} Call 112 (emergency) or 108 (ambulance)</a><div class="sos-list">${PROTOCOLS.map((x) => `<button class="sos-item" data-act="sosPick" data-id="${x.id}">${ic('alert', 20)}${x.title}</button>`).join('')}</div>`}
  </div></div>`;
}

function render() {
  const ae = document.activeElement, fid = ae && ae.id, ss = ae && ae.selectionStart;
  const scrollY = window.scrollY;
  const body = S.view === 'patient' ? (S.tab === 'consult' && !S.consult ? vHero() : '') + guide() + vPatient() : S.view === 'expert' ? vExpert() : guide() + (S.view === 'doctor' ? vDoctor() : vAdmin());
  $app.innerHTML = `<div class="shell"><header class="topbar"><div class="brand">${logo}<span>BareMedix<small>Complete healthcare, stripped of the markup</small></span></div>
  <div class="right"><div class="roles" role="group" aria-label="Demo view">${[['patient', 'user'], ['doctor', 'steth'], ['admin', 'chart'], ['expert', 'heart']].map(([r, i]) => `<button class="${S.view === r ? 'on' : ''}" data-act="role" data-id="${r}">${ic(i, 16)}<span>${r[0].toUpperCase() + r.slice(1)}</span></button>`).join('')}</div>
  <button class="btn alarm" data-act="sosOpen">${ic('alert', 18)} Emergency</button></div></header>
  <main class="main">${body}</main><footer class="foot">Interactive prototype for a campus pilot. Runs entirely in your browser with demo data. Not for real medical use. In an emergency call 112.<div class="hfr">HFR Facility ID: IN-RJ-00014X</div></footer></div>${S.view === 'patient' ? bottomNav() : ''}${vSOS()}`;
  Call.mount();
  if (fid) { const el = document.getElementById(fid); if (el) { el.focus(); try { if (ss != null) el.setSelectionRange(ss, ss); } catch (e) {} } }
  window.scrollTo(0, scrollY);
  const log = document.getElementById('chatlog'); if (log) log.scrollTop = log.scrollHeight;
}

/* ---------- actions ---------- */
const A = {
  role: (id) => { S.view = id; S.docErr = ''; },
  tab: (id) => { S.tab = id; S.placedMsg = ''; },
  sub: (id) => { S.sub = id; },
  focusSym: () => { setTimeout(() => { const el = document.getElementById('sym'); if (el) { el.scrollIntoView({ block: 'center' }); el.focus(); } }, 0); },
  chip: (_, el) => { const q = el.dataset.q.toLowerCase(); const cur = D('sym').trim(); S.draft.sym = cur ? cur + ', ' + q : 'I have ' + q; },
  sosOpen: () => { S.sos = 'list'; }, sosClose: () => { S.sos = null; }, sosPick: (id) => { S.sos = id; }, sosBack: () => { S.sos = 'list'; },
  goOnline: () => { S.online = !S.online; toast(S.online ? 'You are online. Patients can reach you now.' : 'You are offline.'); },
  req: () => {
    const t = D('sym').trim(); S.errs.consult = '';
    if (t.length < 5) { S.errs.consult = 'Describe your symptoms in a few words so the doctor can prepare.'; return; }
    if (S.consult) { S.errs.consult = 'You already have an active consultation.'; return; }
    S.consult = { symptoms: t, status: 'requested', t0: Date.now(), messages: [] }; S.lastDone = null; S.draft.sym = '';
    addAudit('Aarav Singh', 'consult request');
  },
  cancel: () => { S.consult = null; },
  accept: () => {
    const c = S.consult; if (!c || c.status !== 'requested') return;
    c.status = 'accepted'; c.tAcc = Date.now();
    S.consents.unshift({ id: uid++, who: 'Dr. Priya Rao', revoked: false });
    addAudit('Priya Rao', 'consult accept'); toast('Consultation accepted. Join the video call when ready.');
  },
  send: (_, el) => {
    const t = D('chat').trim(); if (!t || !S.consult) return;
    S.consult.messages.push({ from: el.dataset.me, text: t }); S.draft.chat = '';
    Call.talkUntil = Date.now() + 2800; /* the simulated participant "replies" with a speaking animation */
  },
  addRx: (_, el) => { const m = MEDS.find((x) => x.id === +el.value); if (m) S.rxItems.push({ medicine_id: m.id, name: m.g + ' ' + m.s, dosage: '', duration: '' }); },
  rmRx: (id) => { S.rxItems.splice(+id, 1); },
  finish: async () => {
    const c = S.consult; S.errs.finish = '';
    if (!D('dx').trim()) { S.errs.finish = 'Add a working diagnosis or impression.'; return; }
    const note = await addRecord('consultation', 'Teleconsultation with Dr. Priya Rao', { symptoms: c.symptoms, diagnosis: D('dx'), advice: D('adv'), follow_up: D('fu'), doctor: 'Priya Rao', at: new Date().toLocaleString() });
    let rx = null;
    if (S.rxItems.length) rx = await addRecord('prescription', 'Prescription by Dr. Priya Rao', { items: S.rxItems.map((r) => ({ medicine_id: r.medicine_id, name: r.name, dosage: r.dosage, duration: r.duration })), doctor: 'Priya Rao', at: new Date().toLocaleString() });
    addAudit('Priya Rao', 'record write');
    const d = { tReq: c.t0, tAcc: c.tAcc, tDone: Date.now(), noteId: note.id, rxId: rx && rx.id };
    S.done.unshift(d); S.lastDone = d; S.consult = null; S.rxItems = []; S.draft.dx = S.draft.adv = S.draft.fu = '';
    Call.destroy(); toast('Consultation finished. Records saved, encrypted.');
  },
  orderRx: () => { S.rxSel = S.lastDone.rxId; S.tab = 'pharmacy'; },
  medAdd: (id) => { S.cart[id] = Math.min((S.cart[id] || 0) + 1, 10); S.errs.order = ''; },
  medSub: (id) => { if (--S.cart[id] <= 0) delete S.cart[id]; },
  rxSel: (_, el) => { S.rxSel = el.value; },
  place: async () => {
    S.errs.order = '';
    const lines = Object.entries(S.cart).map(([id, n]) => ({ m: MEDS.find((x) => x.id === +id), n }));
    if (!D('addr').trim()) { S.errs.order = 'Add a delivery address (hostel/block/room).'; return; }
    const hs = lines.filter((l) => l.m.sch === 'H');
    if (hs.length) {
      const rec = S.records.find((r) => r.id === +S.rxSel && r.type === 'prescription');
      if (!rec) { S.errs.order = hs.map((l) => l.m.g).join(', ') + ' needs a valid prescription. Book a consult first.'; return; }
      const rx = await decRec(rec); addAudit('Pharmacy check', 'prescription verified');
      const ids = new Set(rx.items.map((i) => i.medicine_id));
      const miss = hs.filter((l) => !ids.has(l.m.id));
      if (miss.length) { S.errs.order = miss.map((l) => l.m.g).join(', ') + ' is not on the selected prescription.'; return; }
    }
    const total = lines.reduce((s, l) => s + l.m.price * l.n, 0), brand = lines.reduce((s, l) => s + l.m.mrp * l.n, 0);
    S.orders.unshift({ id: uid++, t: Date.now(), status: 'placed', total, brand, items: lines.map((l) => ({ n: l.n, g: l.m.g })) });
    S.placedMsg = 'Order placed. Arriving in about 90 minutes. You saved ' + money(brand - total) + '.'; S.cart = {}; toast('Order placed. You saved ' + money(brand - total) + '.');
  },
  advOrder: (id) => { const o = S.orders.find((x) => x.id === +id), n = { placed: 'packed', packed: 'out', out: 'delivered' }[o.status]; if (n) { o.status = n; if (n === 'delivered') { o.tDel = Date.now() + 82 * 60000; toast('Order delivered.'); } } },
  selLab: (id) => { S.selLab = +id || null; S.errs.lab = ''; },
  bookLab: () => {
    if (!D('labaddr').trim()) { S.errs.lab = 'Pick a collection slot and enter your address.'; return; }
    const t = LABS.find((l) => l.id === S.selLab); S.labBookings.unshift({ id: uid++, name: t.name, slot: D('labslot', LAB_SLOTS[0]), status: 'booked' }); S.selLab = null; toast('Lab test booked.');
  },
  advLab: async (id) => {
    const b = S.labBookings.find((x) => x.id === +id), n = { booked: 'collected', collected: 'processing', processing: 'ready' }[b.status]; if (!n) return; b.status = n;
    if (n === 'ready') { await addRecord('lab_report', 'Lab report: ' + b.name, { test: b.name, note: 'DEMO REPORT - sample values generated by the prototype, not real results.', results: [{ parameter: 'Sample parameter', value: '--', range: '--' }] }); toast('Report ready and saved, encrypted.'); }
  },
  coachQuick: (_, el) => coach(el.dataset.q), coachSend: () => { coach(D('coach')); S.draft.coach = ''; },
  genPlan: () => { S.plan = genWorkout({ goal: D('goal', 'general fitness'), level: D('level', 'beginner'), days: D('days', 3), minutes: D('minutes', 30), equipment: D('equipment', 'none'), injuries: D('injuries') }); S.planSaved = false; },
  savePlan: async () => { await addRecord('workout_plan', 'Workout plan: ' + S.plan.summary.slice(0, 50), S.plan); S.planSaved = true; toast('Plan saved to My records.'); },
  expertOnline: () => { S.expertOnline = !S.expertOnline; toast(S.expertOnline ? 'You are online. Clients can see you as available.' : 'You are offline.'); },
  expertDone: (id) => { const b = S.provBookings.find((x) => x.id === +id); if (b) { b.done = true; toast('Session marked complete.'); } },
  selProv: (id) => { S.selProv = +id; },
  bookProv: () => { const p = PROVIDERS.find((x) => x.id === S.selProv); S.provBookings.unshift({ id: uid++, pid: p.id, name: p.name, client: 'Aarav Singh', slot: D('proslot', PRO_SLOTS[0]), done: false }); S.selProv = null; toast('Session booked with ' + p.name + '.'); },
  openRec: async (id) => { const r = S.records.find((x) => x.id === +id); S.openRec = { title: r.title, content: await decRec(r) }; addAudit('Aarav Singh', 'record read'); },
  closeRec: () => { S.openRec = null; },
  revoke: (id) => { S.consents.find((c) => c.id === +id).revoked = true; addAudit('Aarav Singh', 'consent revoke'); toast('Access revoked.'); },
  docOpen: async (id) => {
    S.docErr = ''; S.docRec = null;
    if (!S.consents.some((c) => c.who === 'Dr. Priya Rao' && !c.revoked)) { S.docErr = 'The patient has not granted you access.'; addAudit('Priya Rao', 'access denied'); return; }
    const r = S.records.find((x) => x.id === +id); S.docRec = { title: r.title, content: await decRec(r) }; addAudit('Priya Rao', 'record read');
  },
  docClose: () => { S.docRec = null; },
  abhaCreate: () => { let n = String(1 + Math.floor(Math.random() * 9)); while (n.length < 14) n += Math.floor(Math.random() * 10); S.draft.abha = fmtAbha(n); S.errs.abha = ''; },
  abhaVerify: () => {
    const d = D('abha').replace(/[\s-]/g, '');
    if (!/^\d{14}$/.test(d)) { S.errs.abha = 'Enter all 14 digits of your ABHA number. Digits only.'; return; }
    S.errs.abha = ''; S.abha = { linked: true, num: d, via: 'Aadhaar / mobile OTP' }; S.draft.abha = '';
    addAudit('Aarav Singh', 'ABHA ID linked'); toast('ABHA ID verified and linked (demo).');
  },
  abhaUnlink: () => { S.abha = { linked: false, num: '', via: '' }; addAudit('Aarav Singh', 'ABHA ID unlinked'); },
  approve: () => { S.pendingDoc = false; toast('Dr. Ishita Jain approved.'); },
};
function coach(text) {
  text = (text || '').trim(); if (!text) return;
  S.chat.push({ role: 'user', text });
  const p = matchSOS(text); /* emergency rules run first and never go through an AI */
  S.chat.push(p ? { role: 'assistant', p } : { role: 'assistant', text: coachReply(text) });
}

document.addEventListener('click', async (e) => {
  const cb = e.target.closest('[data-call]');
  if (cb) { await Call[cb.dataset.call](); return; }
  const el = e.target.closest('[data-act]'); if (!el || el.tagName === 'SELECT') return;
  const fn = A[el.dataset.act]; if (!fn) return;
  await fn(el.dataset.id, el);
  render();
});
document.addEventListener('change', async (e) => {
  const el = e.target;
  if (el.tagName === 'SELECT' && el.dataset.act) { await A[el.dataset.act](el.value, el); render(); }
  else if (el.tagName === 'SELECT' && el.dataset.d) { S.draft[el.dataset.d] = el.value; }
});
document.addEventListener('input', (e) => {
  const el = e.target;
  if (el.dataset.d && el.tagName !== 'SELECT') S.draft[el.dataset.d] = el.value;
  if (el.dataset.rx) { const [i, k] = el.dataset.rx.split(':'); S.rxItems[+i][k] = el.value; }
  if (el.id === 'q') render();
});
document.addEventListener('keydown', async (e) => {
  if (e.key === 'Escape' && S.sos) { S.sos = null; render(); return; }
  if (e.key === 'Enter' && e.target.id === 'chat') { await A.send(null, { dataset: { me: S.view === 'doctor' ? 'doctor' : 'patient' } }); render(); }
  if (e.key === 'Enter' && e.target.id === 'coach') { A.coachSend(); render(); }
});
setInterval(() => {
  const c = S.consult;
  const w = document.getElementById('t-wait'); if (w && c) w.textContent = mmss((Date.now() - c.t0) / 1000);
  const i = document.getElementById('t-in'); if (i && c && c.tAcc) i.innerHTML = ic('clock', 14) + ' ' + mmss((Date.now() - c.tAcc) / 1000);
}, 1000);
render();
</script>
</body>
</html>
